{% extends "admin/base.html" %}

{% block title %}{{ title }} | Depósito Social Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}">
        <img src="https://depositosocial.com/wp-content/uploads/2024/05/Logo-celebracion-50-anos-deposito-social.png"
             alt="Depósito Social"
             style="max-height: 50px; margin: 10px 0;"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span style="display:none; color: #FFC107; font-size: 24px; font-weight: bold;">Depósito Social</span>
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
<style>
    /* Variables de color */
    :root {
        --primary-color: #FFC107;
        --secondary-color: #87CEEB;
        --primary-light: #FFD54F;
        --secondary-light: #B0E0E6;
    }

    /* Header */
    #header {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
        color: white;
        padding: 15px 20px;
    }

    #branding h1 {
        margin: 0;
        padding: 0;
    }

    #branding h1 a:link,
    #branding h1 a:visited {
        color: white;
        text-decoration: none;
    }

    /* Usuario info */
    #user-tools {
        color: white;
        padding: 10px;
        text-align: right;
    }

    #user-tools a {
        color: white;
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        padding-bottom: 2px;
    }

    #user-tools a:hover {
        border-bottom-color: var(--secondary-color);
        color: var(--secondary-light);
    }

    /* Breadcrumbs */
    .breadcrumbs {
        background: #f8f9fa;
        padding: 15px 20px;
        border-bottom: 2px solid var(--secondary-color);
    }

    .breadcrumbs a {
        color: var(--primary-color);
        font-weight: 500;
    }

    .breadcrumbs a:hover {
        color: var(--secondary-color);
    }

    /* Botones */
    .button,
    input[type=submit],
    input[type=button],
    .submit-row input,
    a.button {
        background: linear-gradient(135deg, var(--secondary-color) 0%, var(--secondary-light) 100%);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: 600;
        transition: all 0.3s;
    }

    .button:hover,
    input[type=submit]:hover,
    input[type=button]:hover,
    .submit-row input:hover,
    a.button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
    }

    .button.default,
    input[type=submit].default,
    .submit-row input.default {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
    }

    .button.default:hover,
    input[type=submit].default:hover {
        box-shadow: 0 4px 12px rgba(26, 54, 93, 0.3);
    }

    /* Módulos de la página principal */
    .module h2,
    .module caption,
    .inline-group h2 {
        background: var(--primary-color);
        color: white;
        padding: 12px 15px;
        border-radius: 6px 6px 0 0;
        font-weight: 600;
    }

    .module {
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
    }

    /* Tablas */
    #changelist-form table {
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    thead th {
        background: var(--primary-color);
        color: white;
        padding: 12px;
        font-weight: 600;
    }

    tr:hover {
        background-color: rgba(255, 107, 53, 0.05);
    }

    /* Links de acción */
    .addlink,
    .changelink,
    .deletelink {
        padding-left: 20px;
        background-position: 0 center;
        background-repeat: no-repeat;
    }

    a.addlink:hover,
    a.changelink:hover {
        color: var(--secondary-color);
    }

    /* Dashboard */
    #content-main {
        padding: 20px;
    }

    .dashboard .module table th {
        background: var(--primary-color);
        color: white;
    }

    .dashboard .module table td {
        padding: 12px;
    }

    /* Mensajes */
    .messagelist {
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 20px;
    }

    .messagelist .success {
        background: #10b981;
        color: white;
        border: none;
    }

    .messagelist .warning {
        background: var(--secondary-color);
        color: white;
        border: none;
    }

    .messagelist .error {
        background: #dc2626;
        color: white;
        border: none;
    }

    /* Campos de formulario */
    .form-row {
        padding: 15px 10px;
        border-bottom: 1px solid #eee;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="url"],
    input[type="number"],
    textarea,
    select {
        border: 2px solid #e5e7eb;
        border-radius: 6px;
        padding: 8px 12px;
        transition: border-color 0.3s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus,
    input[type="url"]:focus,
    input[type="number"]:focus,
    textarea:focus,
    select:focus {
        border-color: var(--secondary-color);
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
    }

    /* Selector de fecha/hora */
    .datetimeshortcuts {
        color: var(--primary-color);
    }

    .datetimeshortcuts a:hover {
        color: var(--secondary-color);
    }

    /* Paginación */
    .paginator {
        padding: 15px 0;
    }

    .paginator a:link,
    .paginator a:visited {
        background: white;
        border: 2px solid var(--primary-color);
        color: var(--primary-color);
        padding: 8px 12px;
        border-radius: 6px;
        margin: 0 3px;
        transition: all 0.3s;
    }

    .paginator a:hover {
        background: var(--primary-color);
        color: white;
    }

    .paginator .this-page {
        background: var(--secondary-color);
        color: white;
        padding: 8px 12px;
        border-radius: 6px;
        margin: 0 3px;
        font-weight: 600;
    }

    /* Filtros */
    #changelist-filter {
        background: #f8f9fa;
        border-left: 3px solid var(--secondary-color);
        border-radius: 8px;
        padding: 15px;
    }

    #changelist-filter h2 {
        background: var(--primary-color);
        color: white;
        padding: 10px;
        border-radius: 6px;
        margin: 0 -15px 15px -15px;
    }

    #changelist-filter h3 {
        color: var(--primary-color);
        font-weight: 600;
        margin-top: 15px;
    }

    #changelist-filter a:hover {
        color: var(--secondary-color);
    }

    /* Acciones */
    .actions {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .actions label {
        color: var(--primary-color);
        font-weight: 600;
    }

    /* Login page */
    .login {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
    }

    .login #header {
        background: transparent;
    }

    .login #content {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .login .submit-row {
        background: transparent;
        padding: 15px 0;
    }

    /* Responsive */
    @media (max-width: 768px) {
        #header {
            padding: 10px;
        }

        #branding img {
            max-height: 40px;
        }

        .module h2 {
            font-size: 14px;
            padding: 10px;
        }
    }
</style>
{% endblock %}
